{% extends 'base.html' %}
{% block content %}
<h2>Appointment History</h2>
<table>
<tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th></tr>
{% for h in history %}
<tr>
<td>{{h.patient}}</td>
<td>{{h.doctor}}</td>
<td>{{h.date}}</td>
<td>{{h.time}}</td>
<td>{{h.status}}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
