{% extends 'base.html' %}
{% block content %}
<h2>Doctors</h2>
<form method="get">
  <input name="q" placeholder="Search doctor">
  <button>Search</button>
</form>

<a href="/add_doctor" class="btn btn-primary" style="margin-bottom:15px;">
  Add Doctor
</a>

<table>
<tr>
  <th>Name</th>
  <th>Specialization</th>
  <th>Status</th>
  <th>Action</th>
</tr>

{% for d in doctors %}
<tr>
  <td>{{d.name}}</td>
  <td>{{d.specialization}}</td>
  <td>
    {% if d.available %}
      <span class="available">Available</span>
    {% else %}
      <span class="unavailable">Unavailable</span>
    {% endif %}
  </td>
  <td class="action">
    <a href="/edit_doctor/{{d.id}}" class="edit">Edit</a>
    <a href="/delete_doctor/{{d.id}}" class="delete"
       onclick="return confirm('Delete this doctor?');">Delete</a>
    <a href="/toggle_doctor/{{d.id}}" class="edit">Toggle</a>
  </td>
</tr>
{% endfor %}
</table>

{% endblock %}
